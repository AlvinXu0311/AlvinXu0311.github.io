<section class="section proyects" id='proyects'>
    <div class="container">
        <div class="section-box">
            <div data-aos="fade-up" data-aos-duration="1000">
                <h3 class="section-title">
                    <span class='n-section-title'>04.</span> {{"FeatureProjects.Title" | translate}}
                </h3>
            </div>

            <div class="proyect-grid">
                <article *ngFor='let project of "FeatureProjects.Projects" | translate; let i = index'
                    class="proyect-card" [attr.data-accent]="i % 4" data-aos="fade-up" data-aos-duration="1000">

                    <div class="proyect-card-media" *ngIf="project.showImage !== false && project.imgs?.length">
                        <img [src]="project.imgs[0]" [alt]="project.Title" loading="lazy">
                    </div>

                    <div class="proyect-card-body">
                        <!-- Title and links share one row: the old separate
                             "Featured Project" label row cost every card a line
                             while saying the same thing five times. -->
                        <div class="proyect-card-top">
                            <h4 class="proyect-card-title">{{project.Title}}</h4>
                            <div class="proyect-card-links">
                                <a *ngIf="project['demoLink']" [href]="project['demoLink']" target="_blank"
                                    rel="noopener noreferrer" [attr.aria-label]="project.Title + ' demo'">
                                    <i class="fas fa-external-link-alt"></i>
                                </a>
                                <a *ngIf="project['ghLink']" [href]="project['ghLink']" target="_blank"
                                    rel="noopener noreferrer" [attr.aria-label]="project.Title + ' on GitHub'">
                                    <i class="fab fa-github"></i>
                                </a>
                            </div>
                        </div>

                        <p class="proyect-card-description" [innerHTML]="project.Description"></p>

                        <ul class="proyect-skills">
                            <li *ngFor='let technology of project.Technologies'>
                                <span class="technology">{{technology}}</span>
                            </li>
                        </ul>
                    </div>
                </article>
            </div>
        </div>
    </div>
</section>

<!-- ===========================================================================
     LEGACY: the auto-playing owl carousel with the alternating left/right
     layout. Replaced by the flat .proyect-grid above; kept here for reference.
     Its styles are commented out at the bottom of proyects.component.scss.
     ===========================================================================

            <div *ngFor='let project of "FeatureProjects.Projects" | translate; let i = index' class="d-flex proyect-container" data-aos="fade-up" data-aos-duration="1000">
                <owl-carousel-o class='owl-carousel-o' [options]="customOptions" *ngIf="i%2==0 && project.showImage !== false">
                    <ng-container *ngFor="let img of project.imgs">
                        <ng-template carouselSlide [id]="project.Title+slide+i">
                            <div #imgContainer class='img-container'>
                                <img class='img-feature-proyect rounded' [src]="img" [alt]="project.Title">
                            </div>
                        </ng-template>
                    </ng-container>
                </owl-carousel-o>
                <div class="img-feature-proyect-container" data-aos="fade-up" data-aos-duration="1000" *ngIf="i%2==0 && project.showImage !== false">
                    <div class="img-feature-proyect-box">
                        <div class="img-container" style='width: auto;'>
                            <img class='img-feature-proyect rounded' [src]="project.imgs[0]" [alt]="project.imgs[0]" width='600px'>
                        </div>
                    </div>
                </div>
                <div [class.proyect-info-right]='i%2==0' [class.proyect-info-left]='i%2!=0' class="h-100" style="background-image: url('{{project.img}}');">
                    <div class="proyect-box">
                        <h5 [class.text-right]='i%2==0' [class.text-left]='i%2!=0' class="proyect-name">{{project.Title}}</h5>

                        <div class="proyect-description-box" (click)='debug()'>
                            <p class="mb-0" [innerHTML]="project.Description">
                            </p>
                        </div>
                        <ul [class.justify-content-end]='i%2==0' [class.justify-content-start]='i%2!=0' class="proyect-skills">
                            <li *ngFor='let technology of project.Technologies' class="ml-3">
                              <span class="technology">{{technology}}</span>
                            </li>
                        </ul>
                        <div [class.text-right]='i%2==0' [class.text-left]='i%2!=0' class="proyect-links">
                            <a *ngIf="project['ghLink']" style='color: inherit' [href]="project['ghLink']" target="_blank"><i class="ml-3 fab fa-github"></i></a>
                            <a *ngIf="project['demoLink']" style='color: inherit' [href]="project['demoLink']" target="_blank"><i class="ml-3 fas fa-external-link-alt"></i></a>
                        </div>
                    </div>
                </div>
            </div>

     =========================================================================== -->
